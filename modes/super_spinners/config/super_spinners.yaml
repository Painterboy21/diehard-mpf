#config_version=6

# ------------------------------------------------------------
# SUPER SPINNERS
# ------------------------------------------------------------
# What this mode does:
#   - Runs during each ball.
#   - Counts left/right spinner hits toward Super Spinners.
#   - Starts Super Spinners after 25 / 50 / 100 hits as add-a-ball awards are earned.
#   - While active, spinner scoring is boosted.
#   - Tracks progress with player vars for the status display.
# ------------------------------------------------------------
mode:
  start_events:
    - ball_started
  stop_events:
    - ball_ended
  priority: 160

# ------------------------------------------------------------
# TIMERS
# ------------------------------------------------------------
# Super Spinners lasts 120 seconds once started.
# ------------------------------------------------------------
timers:
  super_combo_check:
    start_value: 0
    end_value: 1
    tick_interval: 1s
    start_running: false
    restart_on_complete: true
    control_events:
      - event: super_spinners_start{(current_player.multiball_running != 1 or current_player.super_combo_from_mystery == 1) and not (mode.ambush.active or mode.skillshot.active or mode.villain_select.active or mode.wizard_mode.active or mode.yippee_ki_yay_wizard.active or mode.airplane_multiball.active or mode.central_park_multiball.active or mode.nakatomi_multiball.active or mode.eob_bonus.active or mode.hans_diehard.active or mode.hans_dieharder.active or mode.karl_diehard.active or mode.karl_dieharder.active or mode.katya_diehard.active or mode.katya_dieharder.active or mode.simon_diehard.active or mode.simon_dieharder.active or mode.col_stuart_diehard.active or mode.col_stuart_dieharder.active or mode.hans_difficulty_select.active or mode.karl_difficulty_select.active or mode.katya_difficulty_select.active or mode.simon_difficulty_select.active or mode.col_difficulty_select.active)}
        action: restart
      - event: super_jets_started{(current_player.multiball_running != 1 or current_player.super_combo_from_mystery == 1) and not (mode.ambush.active or mode.skillshot.active or mode.villain_select.active or mode.wizard_mode.active or mode.yippee_ki_yay_wizard.active or mode.airplane_multiball.active or mode.central_park_multiball.active or mode.nakatomi_multiball.active or mode.eob_bonus.active or mode.hans_diehard.active or mode.hans_dieharder.active or mode.karl_diehard.active or mode.karl_dieharder.active or mode.katya_diehard.active or mode.katya_dieharder.active or mode.simon_diehard.active or mode.simon_dieharder.active or mode.col_stuart_diehard.active or mode.col_stuart_dieharder.active or mode.hans_difficulty_select.active or mode.karl_difficulty_select.active or mode.katya_difficulty_select.active or mode.simon_difficulty_select.active or mode.col_difficulty_select.active)}
        action: restart
      - event: super_combo_start
        action: stop
      - event: super_combo_add_to_mystery
        action: stop
      - event: ball_ending
        action: stop
      - event: tilt
        action: stop
  super_spinners_timer:
    start_value: 120
    end_value: 0
    direction: down
    tick_interval: 1s
    start_running: false
    control_events:
      - event: super_spinners_start{(current_player.multiball_running != 1 or current_player.super_combo_from_mystery == 1) and not (mode.ambush.active or mode.skillshot.active or mode.villain_select.active or mode.wizard_mode.active or mode.yippee_ki_yay_wizard.active or mode.airplane_multiball.active or mode.central_park_multiball.active or mode.nakatomi_multiball.active or mode.eob_bonus.active or mode.hans_diehard.active or mode.hans_dieharder.active or mode.karl_diehard.active or mode.karl_dieharder.active or mode.katya_diehard.active or mode.katya_dieharder.active or mode.simon_diehard.active or mode.simon_dieharder.active or mode.col_stuart_diehard.active or mode.col_stuart_dieharder.active or mode.hans_difficulty_select.active or mode.karl_difficulty_select.active or mode.katya_difficulty_select.active or mode.simon_difficulty_select.active or mode.col_difficulty_select.active)}
        action: restart
      - event: super_spinners_stop
        action: stop
      - event: ball_ended
        action: stop

# ------------------------------------------------------------
# COUNTERS
# ------------------------------------------------------------
# Counts spinner hits until Super Spinners starts.
# The next ball target doubles only after a completed add-a-ball award.
# ------------------------------------------------------------
counters:
  super_spinners_counter:
    count_events:
      - SpinnerLeft_active{current_player.super_spinners != 1 and (current_player.multiball_running != 1 or current_player.super_combo_from_mystery == 1) and not (mode.ambush.active or mode.skillshot.active or mode.villain_select.active or mode.wizard_mode.active or mode.yippee_ki_yay_wizard.active or mode.airplane_multiball.active or mode.central_park_multiball.active or mode.nakatomi_multiball.active or mode.eob_bonus.active or mode.hans_diehard.active or mode.hans_dieharder.active or mode.karl_diehard.active or mode.karl_dieharder.active or mode.katya_diehard.active or mode.katya_dieharder.active or mode.simon_diehard.active or mode.simon_dieharder.active or mode.col_stuart_diehard.active or mode.col_stuart_dieharder.active or mode.hans_difficulty_select.active or mode.karl_difficulty_select.active or mode.katya_difficulty_select.active or mode.simon_difficulty_select.active or mode.col_difficulty_select.active)}
      - SpinnerRight_active{current_player.super_spinners != 1 and (current_player.multiball_running != 1 or current_player.super_combo_from_mystery == 1) and not (mode.ambush.active or mode.skillshot.active or mode.villain_select.active or mode.wizard_mode.active or mode.yippee_ki_yay_wizard.active or mode.airplane_multiball.active or mode.central_park_multiball.active or mode.nakatomi_multiball.active or mode.eob_bonus.active or mode.hans_diehard.active or mode.hans_dieharder.active or mode.karl_diehard.active or mode.karl_dieharder.active or mode.katya_diehard.active or mode.katya_dieharder.active or mode.simon_diehard.active or mode.simon_dieharder.active or mode.col_stuart_diehard.active or mode.col_stuart_dieharder.active or mode.hans_difficulty_select.active or mode.karl_difficulty_select.active or mode.katya_difficulty_select.active or mode.simon_difficulty_select.active or mode.col_difficulty_select.active)}
    starting_count: 0
    count_complete_value: current_player.super_spinners_goal
    direction: up
    persist_state: false
    reset_on_complete: true
    events_when_complete:
      - super_spinners_start
    events_when_hit:
      - super_spinners_counted

# ------------------------------------------------------------
# EVENT PLAYER
# ------------------------------------------------------------
# Stops Super Spinners when the timer expires.
# ------------------------------------------------------------
event_player:
  super_spinners_start{(current_player.multiball_running != 1 or current_player.super_combo_from_mystery == 1) and not (mode.ambush.active or mode.skillshot.active or mode.villain_select.active or mode.wizard_mode.active or mode.yippee_ki_yay_wizard.active or mode.airplane_multiball.active or mode.central_park_multiball.active or mode.nakatomi_multiball.active or mode.eob_bonus.active or mode.hans_diehard.active or mode.hans_dieharder.active or mode.karl_diehard.active or mode.karl_dieharder.active or mode.katya_diehard.active or mode.katya_dieharder.active or mode.simon_diehard.active or mode.simon_dieharder.active or mode.col_stuart_diehard.active or mode.col_stuart_dieharder.active or mode.hans_difficulty_select.active or mode.karl_difficulty_select.active or mode.katya_difficulty_select.active or mode.simon_difficulty_select.active or mode.col_difficulty_select.active)}:
    - super_combo_check|10ms
  super_jets_started{(current_player.multiball_running != 1 or current_player.super_combo_from_mystery == 1) and not (mode.ambush.active or mode.skillshot.active or mode.villain_select.active or mode.wizard_mode.active or mode.yippee_ki_yay_wizard.active or mode.airplane_multiball.active or mode.central_park_multiball.active or mode.nakatomi_multiball.active or mode.eob_bonus.active or mode.hans_diehard.active or mode.hans_dieharder.active or mode.karl_diehard.active or mode.karl_dieharder.active or mode.katya_diehard.active or mode.katya_dieharder.active or mode.simon_diehard.active or mode.simon_dieharder.active or mode.col_stuart_diehard.active or mode.col_stuart_dieharder.active or mode.hans_difficulty_select.active or mode.karl_difficulty_select.active or mode.katya_difficulty_select.active or mode.simon_difficulty_select.active or mode.col_difficulty_select.active)}:
    - super_combo_check|10ms
  timer_super_combo_check_complete:
    - super_combo_check
  super_combo_check{current_player.super_combo_spinners_done == 1 and current_player.super_combo_pops_done == 1 and current_player.super_combo_awarded == 0 and current_player.super_combo_blocked == 0 and current_player.multiball_running != 1 and current_player.villain_mode_running != 1 and current_player.villain_select_running != 1 and current_player.villain_difficulty_select_running != 1 and current_player.wizard_mode_running != 1 and game.balls_in_play == 1}:
    - super_combo_start
  super_combo_check{current_player.super_combo_spinners_done == 1 and current_player.super_combo_pops_done == 1 and current_player.super_combo_awarded == 0 and current_player.super_combo_blocked == 0 and current_player.multiball_running == 1 and current_player.super_combo_from_mystery == 1 and current_player.villain_mode_running != 1 and current_player.villain_select_running != 1 and current_player.villain_difficulty_select_running != 1 and current_player.wizard_mode_running != 1 and game.balls_in_play >= 2}:
    - super_combo_add_to_mystery
  timer_super_spinners_timer_complete:
    - super_spinners_stop

# ------------------------------------------------------------
# VARIABLE PLAYER
# ------------------------------------------------------------
# super_spinners:
#   0 = off
#   1 = active
#
# super_spinners_hits:
#   Current spinner hits toward Super Spinners.
#
# super_spinners_goal:
#   Target spinner hits needed. Used by the status display.
# ------------------------------------------------------------
variable_player:
  mode_super_spinners_started:
    super_combo_from_mystery:
      action: set
      int: 0
    super_spinners:
      action: set
      int: 0
    super_spinners_hits:
      action: set
      int: 0
    super_spinners_goal:
      action: set
      int: "25 * 2 ** current_player.super_combo_awards"
    super_combo_spinners_done:
      action: set
      int: 0
    super_combo_pops_done:
      action: set
      int: 0
    super_combo_awarded:
      action: set
      int: 0
    super_combo_blocked:
      action: set
      int: 0

  # ------------------------------------------------------------
  # Count spinner hits toward Super Spinners while inactive.
  # ------------------------------------------------------------
  super_spinners_counted{current_player.super_spinners != 1 and (current_player.multiball_running != 1 or current_player.super_combo_from_mystery == 1) and not (mode.ambush.active or mode.skillshot.active or mode.villain_select.active or mode.wizard_mode.active or mode.yippee_ki_yay_wizard.active or mode.airplane_multiball.active or mode.central_park_multiball.active or mode.nakatomi_multiball.active or mode.eob_bonus.active or mode.hans_diehard.active or mode.hans_dieharder.active or mode.karl_diehard.active or mode.karl_dieharder.active or mode.katya_diehard.active or mode.katya_dieharder.active or mode.simon_diehard.active or mode.simon_dieharder.active or mode.col_stuart_diehard.active or mode.col_stuart_dieharder.active or mode.hans_difficulty_select.active or mode.karl_difficulty_select.active or mode.katya_difficulty_select.active or mode.simon_difficulty_select.active or mode.col_difficulty_select.active)}:
    super_spinners_hits:
      action: add
      int: 1

  # ------------------------------------------------------------
  # Start / stop Super Spinners.
  # ------------------------------------------------------------
  super_spinners_start{(current_player.multiball_running != 1 or current_player.super_combo_from_mystery == 1) and not (mode.ambush.active or mode.skillshot.active or mode.villain_select.active or mode.wizard_mode.active or mode.yippee_ki_yay_wizard.active or mode.airplane_multiball.active or mode.central_park_multiball.active or mode.nakatomi_multiball.active or mode.eob_bonus.active or mode.hans_diehard.active or mode.hans_dieharder.active or mode.karl_diehard.active or mode.karl_dieharder.active or mode.katya_diehard.active or mode.katya_dieharder.active or mode.simon_diehard.active or mode.simon_dieharder.active or mode.col_stuart_diehard.active or mode.col_stuart_dieharder.active or mode.hans_difficulty_select.active or mode.karl_difficulty_select.active or mode.katya_difficulty_select.active or mode.simon_difficulty_select.active or mode.col_difficulty_select.active)}:
    super_combo_spinners_done:
      action: set
      int: 1
    super_spinners:
      action: set
      int: 1
    super_spinners_hits:
      action: set
      int: current_player.super_spinners_goal

  super_spinners_stop:
    super_spinners:
      action: set
      int: 0
    super_spinners_hits:
      action: set
      int: 0

  ball_ended:
    super_spinners:
      action: set
      int: 0
    super_spinners_hits:
      action: set
      int: 0

  # ------------------------------------------------------------
  # VPW score adjusted to timed version:
  # Normal spinner already scores 1010 elsewhere.
  # Super Spinners should total 5010.
  #
  # This adds the extra 4000 while active:
  # 1010 + 4000 = 5010.
  # ------------------------------------------------------------
  SpinnerLeft_active{current_player.super_spinners == 1}:
    score:
      action: add
      int: 4000

  SpinnerRight_active{current_player.super_spinners == 1}:
    score:
      action: add
      int: 4000
  super_jets_started{(current_player.multiball_running != 1 or current_player.super_combo_from_mystery == 1) and not (mode.ambush.active or mode.skillshot.active or mode.villain_select.active or mode.wizard_mode.active or mode.yippee_ki_yay_wizard.active or mode.airplane_multiball.active or mode.central_park_multiball.active or mode.nakatomi_multiball.active or mode.eob_bonus.active or mode.hans_diehard.active or mode.hans_dieharder.active or mode.karl_diehard.active or mode.karl_dieharder.active or mode.katya_diehard.active or mode.katya_dieharder.active or mode.simon_diehard.active or mode.simon_dieharder.active or mode.col_stuart_diehard.active or mode.col_stuart_dieharder.active or mode.hans_difficulty_select.active or mode.karl_difficulty_select.active or mode.katya_difficulty_select.active or mode.simon_difficulty_select.active or mode.col_difficulty_select.active)}:
    super_combo_pops_done:
      action: set
      int: 1
  super_combo_start:
    super_combo_awards:
      action: add
      int: 1
    super_combo_awarded:
      action: set
      int: 1
  mystery_start_super_combo:
    super_combo_from_mystery:
      action: set
      int: 1
  super_combo_add_to_mystery:
    super_combo_awards:
      action: add
      int: 1
    super_combo_awarded:
      action: set
      int: 1
  multiball_super_combo_started:
    multiball_running:
      action: set
      int: 1
  multiball_super_combo_ended:
    super_combo_from_mystery:
      action: set
      int: 0
    multiball_running:
      action: set
      int: 0
  ball_ending:
    super_combo_blocked:
      action: set
      int: 1
  tilt:
    super_combo_blocked:
      action: set
      int: 1

# Completing both supers earns one two-ball multiball per ball.
# Use the normal trough/plunger path; total=2 adds one to single-ball play.
multiballs:
  super_combo:
    ball_count: 2
    ball_count_type: total
    shoot_again: 5s
    add_a_ball_events: super_combo_add_to_mystery
    add_a_ball_shoot_again: 5s
    start_events: super_combo_start, mystery_start_super_combo
    stop_events: ball_ending, tilt

# Show the award above the playfield when the supers multiball starts.
widget_player:
  super_combo_add_to_mystery:
    super_combo_add_ball:
      action: play
      slide: _overlay
      expire: 5s
  multiball_super_combo_started:
    super_combo_add_ball:
      action: play
      slide: _overlay
      expire: 5s
  multiball_super_combo_ended:
    super_combo_add_ball:
      action: remove
      slide: _overlay
  ball_ending:
    super_combo_add_ball:
      action: remove
      slide: _overlay
  tilt:
    super_combo_add_ball:
      action: remove
      slide: _overlay
