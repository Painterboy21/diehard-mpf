#config_version=6
# Graduated shaker feedback. Gameplay events are rate-limited before reaching hardware.
shakers:
  main_shaker:
    number: shakerboard-1
    debug: false
    default_power: 0.45
    control_events:
      service_test_shaker_light:
        power: 0.30
        duration: 180ms
      service_test_shaker_medium:
        power: 0.45
        duration: 220ms
      service_test_shaker_strong:
        power: 0.60
        duration: 450ms
      diehard_shaker_impact:
        power: 0.45
        duration: 180ms
      diehard_shaker_award:
        power: 0.60
        duration: 450ms
      tilt:
        action: stop
      ball_ending:
        action: stop
      game_ended:
        action: stop
      service_mode_entered:
        action: stop

machine_vars:
  diehard_shaker_enabled:
    initial_value: 0
    value_type: int
    persist: false
  diehard_shaker_hit_busy:
    initial_value: 0
    value_type: int
    persist: false
  diehard_shaker_award_busy:
    initial_value: 0
    value_type: int
    persist: false

variable_player:
  ball_started:
    diehard_shaker_enabled:
      action: set_machine
      int: 1
  tilt:
    diehard_shaker_enabled:
      action: set_machine
      int: 0
  ball_ending:
    diehard_shaker_enabled:
      action: set_machine
      int: 0
  game_ended:
    diehard_shaker_enabled:
      action: set_machine
      int: 0
  service_mode_entered:
    diehard_shaker_enabled:
      action: set_machine
      int: 0
  diehard_shaker_impact:
    diehard_shaker_hit_busy:
      action: set_machine
      int: 1
  diehard_shaker_award:
    diehard_shaker_award_busy:
      action: set_machine
      int: 1
  diehard_shaker_hit_ready:
    diehard_shaker_hit_busy:
      action: set_machine
      int: 0
  diehard_shaker_award_ready:
    diehard_shaker_award_busy:
      action: set_machine
      int: 0

event_player:
  diehard_shaker_impact:
    - diehard_shaker_hit_ready|350ms
  diehard_shaker_award:
    - diehard_shaker_award_ready|750ms
  pop_bumper_score_5000{machine.diehard_shaker_enabled == 1 and machine.diehard_shaker_hit_busy != 1 and machine.diehard_shaker_award_busy != 1}:
    - diehard_shaker_impact
  pop_bumper_score_25000{machine.diehard_shaker_enabled == 1 and machine.diehard_shaker_hit_busy != 1 and machine.diehard_shaker_award_busy != 1}:
    - diehard_shaker_impact
  bullet_new_unique_shot{machine.diehard_shaker_enabled == 1 and machine.diehard_shaker_hit_busy != 1 and machine.diehard_shaker_award_busy != 1}:
    - diehard_shaker_impact
  counter_airplane_light_lock_hit{machine.diehard_shaker_enabled == 1 and machine.diehard_shaker_hit_busy != 1 and machine.diehard_shaker_award_busy != 1}:
    - diehard_shaker_impact
  hans_diehard_target_hit{machine.diehard_shaker_enabled == 1 and machine.diehard_shaker_hit_busy != 1 and machine.diehard_shaker_award_busy != 1}:
    - diehard_shaker_impact
  hans_dieharder_target_hit{machine.diehard_shaker_enabled == 1 and machine.diehard_shaker_hit_busy != 1 and machine.diehard_shaker_award_busy != 1}:
    - diehard_shaker_impact
  karl_score_spinner{machine.diehard_shaker_enabled == 1 and machine.diehard_shaker_hit_busy != 1 and machine.diehard_shaker_award_busy != 1}:
